<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Тест Земли</title>
    
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <script>
        AFRAME.registerComponent('mytarget', {
            init: function () {
                const video = document.querySelector("#ar-video");
                this.el.addEventListener('targetFound', event => { video.play(); });
                this.el.addEventListener('targetLost', event => { video.pause(); });
            }
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }
        #instruction {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 10px 20px;
            border-radius: 20px; font-family: sans-serif; font-size: 14px; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="instruction">Наведите камеру на маркер для запуска планеты</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Ссылка на ваше видео в корне репозитория -->
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        
            <!-- Идеальные пропорции 16:9 под ваше видео -->
            <a-video src="#ar-video" width="1.77" height="1" position="0 0 0" rotation="0 0 0"></a-video>
        
        
    </a-scene>
    
</body>
</html>

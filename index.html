<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Космос</title>
    
    <!-- Используем стабильные версии A-Frame и MindAR -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #instruction {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 9999; text-align: center;
            pointer-events: none;
        }
    </style>

    <script>
        // Жесткая логика: видео запускается ТОЛЬКО при наведении на маркер
        AFRAME.registerComponent('ar-controller', {
            init: function () {
                const video = document.querySelector('#ar-video');
                
                // Картинка найдена — включаем видеопоток
                this.el.addEventListener("targetFound", () => {
                    video.play().catch(err => console.log("Блокировка воспроизведения:", err));
                });

                // Картинка ушла из кадра — ставим видео на паузу
                this.el.addEventListener("targetLost", () => {
                    video.pause();
                });
            }
        });
    </script>
</head>
<body>

    <div id="instruction">Наведите камеру на маркер для запуска Земли</div>

    <!-- autoStart: true заставляет браузер в первую очередь запустить камеру -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Видео изначально остановлено (нет автозапуска) и принудительно без звука -->
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Привязываем наш скрипт управления к маркеру -->
        
            <!-- Плоскость видео внутри AR пространства -->
            <a-video src="#ar-video" width="1.77" height="1" position="0 0 0"></a-video>
        
        
    </a-scene>

</body>
</html>

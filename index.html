<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Скорость</title>
    
    <!-- Используем супер-стабильные сборки библиотек -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #instruction {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
            border-radius: 30px; font-family: sans-serif; font-size: 14px; 
            z-index: 9999; text-align: center; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>

    <script>
        // Изолированная логика: плеер спит, пока камера не найдет маркер
        AFRAME.registerComponent('ar-video-trigger', {
            init: function () {
                const video = document.querySelector('#ar-video');
                
                // Как только картинка попала в объектив — мгновенно включаем видеопоток
                this.el.addEventListener("targetFound", () => {
                    video.play().catch(err => console.log("Ждем первого тапа для аудио-прав"));
                });

                // Как только картинка скрылась — сразу ставим на паузу
                this.el.addEventListener("targetLost", () => {
                    video.pause();
                });
            }
        });
    </script>
</head>
<body>

    <div id="instruction">Наведите камеру на маркер для запуска Земли</div>

    <!-- autoStart: true + uiLoading: no принудительно включают камеру БЕЗ задержек и заставок -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Свойства autoplay и аutoStart убраны, чтобы плеер не перехватывал фокус у камеры на старте -->
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Вешаем наш триггер на маркер -->
        
            <!-- Плоский экран с вашим видео поверх реального мира -->
            <a-video src="#ar-video" width="1.77" height="1" position="0 0 0"></a-video>
        
        
    </a-scene>

    <script>
        // Глобальный фикс для мобильного Chrome: любой первый клик по экрану разблокирует плеер в памяти
        window.addEventListener('click', () => {
            const v = document.querySelector('#ar-video');
            v.play().then(() => { v.pause(); });
        }, { once: true });
    </script>

</body>
</html>

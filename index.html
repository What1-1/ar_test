<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Тест</title>
    
    <!-- Используем стабильные и проверенные версии библиотек через CDN -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instruction {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 14px; z-index: 9999; text-align: center;
        }
    </style>
</head>
<body>

    <div id="instruction">Наведите камеру на картинку-маркер</div>

    <!-- Основная сцена AR. autoStart: true заставляет камеру включаться мгновенно -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
             embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Видеофайл, muted обязателен, чтобы браузер не блокировал поток -->
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted crossorigin="anonymous"></video>
        </a-assets>

        <!-- Камера сцены. look-controls отключаем, чтобы не ломать AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Объект отслеживания (индекс 0 - ваш единственный маркер) -->
        
            <!-- Видеопанель с пропорциями вашего космического видео -->
            <a-video src="#ar-video" width="1.77" height="1" position="0 0 0"></a-video>
        
        
    </a-scene>

    <script>
        // Простой и надежный запуск видеопотока при наведении
        const video = document.querySelector('#ar-video');
        const target = document.querySelector('#target-element');

        target.addEventListener("targetFound", () => {
            video.play().catch(err => console.log("Ошибка воспроизведения:", err));
        });

        target.addEventListener("targetLost", () => {
            video.pause();
        });
        
        // Лайфхак: первый тап по экрану принудительно запускает видео в фоновом режиме (разблокировка звука/плеера)
        window.addEventListener('click', () => {
            video.play().then(() => { video.pause(); });
        }, { once: true });
    </script>

</body>
</html>

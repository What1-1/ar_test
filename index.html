<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Бесплатный WebAR Космос</title>
    
    <!-- Подключаем A-Frame -->
    <script src="https://aframe.io"></script>
    
    <!-- ИСПРАВЛЕНО: Подключена рабочая ссылка на AR.js для A-Frame -->
    <script src="https://githack.com"></script>
    
    <script>
        // Логика управления: видео запускается только когда маркер виден камере
        AFRAME.registerComponent('video-controller', {
            init: function () {
                const video = document.querySelector("#ar-video");
                this.el.addEventListener('markerFound', () => {
                    video.play().catch(err => console.log("Ждем первого клика пользователя по экрану"));
                });
                this.el.addEventListener('markerLost', () => {
                    video.pause();
                });
            }
        });
    </script>
</head>
<body style="margin: 0px; overflow: hidden; background-color: #000;">

    <!-- Запускаем AR сцену с принудительной активацией веб-камеры -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <a-assets>
            <!-- Твое видео. Флаг muted обязателен, чтобы Хром на телефоне не блокировал автозапуск -->
            <video id="ar-video" src="./video.mp4" preload="auto" loop="true" webkit-playsinline playsinline muted crossorigin="anonymous"></video>
        </a-assets>

        <!-- Используем мировой стандартный маркер HIRO -->
        <a-marker preset="hiro" video-controller>
            <!-- Размещаем видео Земли поверх маркера с пропорциями 16:9 -->
            <!-- Параметр rotation="-90 0 0" кладет видео ровно плашмя на карточку -->
            <a-video src="#ar-video" width="1.77" height="1" position="0 0 0" rotation="-90 0 0"></a-video>
        </a-marker>

        <!-- ИСПРАВЛЕНО: Добавлен обязательный тег камеры сцены для корректного трекинга -->
        
        
    </a-scene>

    <script>
        // Глобальный фикс безопасности Хрома: первый тап по экрану разблокирует звук/плеер в памяти смартфона
        window.addEventListener('click', () => {
            const v = document.querySelector('#ar-video');
            v.play().then(() => {
                v.pause();
            });
        }, { once: true });
    </script>
</body>
</html>
